<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premios · ChaoChaito Quiniela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base }}/static/app.css">
</head>
<body>
<div class="wrap">
  {% include "_nav.html" %}
  <header>
    <div>
      <h1><span>Premios</span></h1>
      <div class="meta">Lo que ha ganado cada jornada y cómo se reparte entre los participantes.</div>
    </div>
  </header>

  <div class="sum" id="sum"></div>

  <div class="card form-card admin-only" id="formCard" style="max-width:none;margin-bottom:18px">
    <h2 class="cond" style="margin:0 0 4px;font-size:22px;text-transform:uppercase">Apuntar un premio</h2>
    <form id="frm" class="inline-form" autocomplete="off">
      <label>Temporada<input type="text" id="temporada" placeholder="2026-2027" required></label>
      <label>Jornada<input type="number" id="jornada" min="1" max="99" required></label>
      <label>Premio (€)<input type="text" id="importe" inputmode="decimal" placeholder="0,00" required></label>
      <label class="wide">Nota (opcional)<input type="text" id="nota" maxlength="120" placeholder="Ej.: 12 aciertos en la apuesta 2"></label>
      <label class="wide">Participantes (si no se apuntaron en la web, con comas)<input type="text" id="nombres" maxlength="500"></label>
      <button type="submit" class="primary">Guardar</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card"><div id="tabla"><div class="loading">Cargando…</div></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = v => v == null ? "—" : v.toLocaleString("es-ES", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
let D = null;

async function api(url, body){
  const r = await fetch(url, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function msg(t, ok){ $("#msg").textContent = t; $("#msg").className = "msg " + (ok ? "okk" : "err"); }

function render(){
  $("#sum").innerHTML = `<div class="kpi"><span>Total ganado</span><b>${eur(D.total)}</b></div>
    <div class="kpi"><span>Jornadas con premio</span><b>${D.con_premio}</b></div>
    <div class="kpi"><span>Jornadas jugadas</span><b>${D.filas.length}</b></div>`;
  if(!$("#temporada").value && D.temporada_actual) $("#temporada").value = D.temporada_actual;
  if(!$("#jornada").value && D.jornada_actual) $("#jornada").value = D.jornada_actual;
  if(!D.filas.length){ $("#tabla").innerHTML = '<div class="loading">Todavía no hay jornadas. Aparecerán en cuanto alguien se apunte o se confirmen apuestas.</div>'; return; }
  let h = `<table><thead><tr><th>Jornada</th><th>Participantes</th><th style="text-align:right">Premio</th><th style="text-align:right">Por persona</th><th class="admin-only"></th></tr></thead><tbody>`;
  D.filas.forEach(f => {
    const titulo = f.jornada ? `Jornada ${f.jornada}` : esc(f.key);
    h += `<tr>
      <td class="teams">${titulo}<small>${esc(f.temporada || "")}${f.nota ? " · " + esc(f.nota) : ""}</small></td>
      <td><b>${f.n}</b> <span class="note">${f.participantes.map(esc).join(", ") || "sin apuntados"}</span></td>
      <td style="text-align:right" class="score ${f.premio ? "win" : ""}">${f.premio == null ? '<span class="note">pendiente</span>' : (f.premio === 0 ? '<span class="note">sin premio</span>' : eur(f.premio))}</td>
      <td style="text-align:right">${f.por_persona == null ? "—" : eur(f.por_persona)}</td>
      <td class="admin-only" style="white-space:nowrap;text-align:right">
        <button type="button" data-edit="${esc(f.key)}">Editar</button>
        ${f.premio != null ? `<button type="button" data-del="${esc(f.key)}" title="Borrar premio">✕</button>` : ""}</td></tr>`;
  });
  $("#tabla").innerHTML = h + "</tbody></table>";
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editar(b.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => borrar(b.dataset.del));
}

function editar(key){
  const f = D.filas.find(x => x.key === key);
  $("#temporada").value = f.temporada || ""; $("#jornada").value = f.jornada || "";
  $("#importe").value = f.premio != null ? String(f.premio).replace(".", ",") : "";
  $("#nota").value = f.nota || "";
  $("#nombres").value = f.nombres_manual ? f.participantes.join(", ") : "";
  $("#formCard").scrollIntoView({behavior: "smooth"}); $("#importe").focus();
}

async function borrar(key){
  if(!confirm("¿Borrar el premio de esta jornada?")) return;
  try { D = await api(`${BASE}/api/premios/${encodeURIComponent(key)}/borrar`, {}); render(); } catch(e){ alert(e.message); }
}

$("#frm").onsubmit = async ev => {
  ev.preventDefault();
  try {
    D = await api(BASE + "/api/premios", {temporada: $("#temporada").value.trim(), jornada: $("#jornada").value,
      importe: $("#importe").value, nota: $("#nota").value, nombres: $("#nombres").value});
    msg("Premio guardado ✓", true); $("#importe").value = ""; $("#nota").value = ""; $("#nombres").value = "";
    render();
  } catch(e){ msg(e.message, false); }
};

api(BASE + "/api/premios").then(d => { D = d; render(); }).catch(e => { $("#tabla").innerHTML = `<div class="loading">${esc(e.message)}</div>`; });
</script>
</body>
</html>
