<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Quieres participar? · ChaoChaito Quiniela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ base }}/static/app.css">
</head>
<body>
<div class="wrap">
  {% include "_nav.html" %}
  <header>
    <div>
      <h1>¿Quieres <span>participar?</span></h1>
      <div class="meta" id="meta">Cargando la jornada…</div>
    </div>
  </header>

  <div class="card form-card partic">
    <div id="contador"></div>
    <form id="frm" autocomplete="off">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" maxlength="40" placeholder="Ej.: Alejandro" required>
      <label class="check"><input type="checkbox" id="bizum"> Bizum hecho</label>
      <button type="submit" class="primary" style="width:100%">Apuntarme</button>
      <div class="msg" id="msg"></div>
    </form>
    <h2 class="cond" style="margin:18px 0 0;font-size:22px;text-transform:uppercase">Apuntados</h2>
    <ul class="plist" id="lista"></ul>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D = null;


function render(){
  const j = D.jornada || {};
  $("#meta").innerHTML = `Jornada <b>${j.jornada ?? "—"}</b> · sorteo ${esc(j.fecha_sorteo || "")}`;
  const lleno = D.total >= D.maximo;
  $("#contador").innerHTML = `<div class="big">${D.total}<span>/${D.maximo} participantes</span></div>
    <div class="progress"><div style="width:${Math.min(100, 100*D.total/D.maximo)}%"></div></div>`;
  $("#lista").innerHTML = D.participantes.length
    ? D.participantes.map((p,i) => `<li><span>${i+1}. <b>${esc(p.nombre)}</b></span><button type="button" class="admin-only" data-id="${p.id}" title="Quitar">✕</button></li>`).join("")
    : '<li class="note">Todavía no se ha apuntado nadie.</li>';
  document.querySelectorAll("#lista button").forEach(b => b.onclick = () => quitar(b.dataset.id));
  $("#frm button[type=submit]").disabled = lleno;
  if(lleno) msg("Ya estamos completos para esta jornada.", false);
  document.getElementById("navCount").textContent = `👥 ${D.total}/${D.maximo}`;
}

function msg(t, ok){ $("#msg").textContent = t; $("#msg").className = "msg " + (ok ? "okk" : "err"); }

async function quitar(id){
  const p = D.participantes.find(x => String(x.id) === String(id));
  if(!confirm(`¿Quitar a ${p ? p.nombre : "este participante"}?`)) return;
  try { D = await api(`${BASE}/api/participantes/${id}/quitar`, {}); render(); } catch(e){ alert(e.message); }
}

$("#frm").onsubmit = async ev => {
  ev.preventDefault();
  const nombre = $("#nombre").value.trim();
  if(!$("#bizum").checked){ msg("Marca «Bizum hecho» para apuntarte.", false); return; }
  try {
    D = await api(BASE + "/api/participar", {nombre, bizum: true});
    msg(`¡Apuntado, ${nombre}! Suerte 🍀`, true);
    $("#nombre").value = ""; $("#bizum").checked = false;
    render();
  } catch(e){ msg(e.message, false); }
};

api(BASE + "/api/participantes").then(d => { D = d; render(); }).catch(e => msg(e.message, false));
</script>
</body>
</html>
